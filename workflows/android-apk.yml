name: Build Android APK (RC)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag for the APK asset'
        required: true
        default: 'v2.7.0-rc.1'
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.release_tag || 'v2.7.0-rc.1' }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v2.7.0-rc.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser regression dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run release QA and minified build
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: '1'
      - name: Create or sync Capacitor Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi
      - name: Assemble installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Zalma.apk
          sha256sum release/Zalma.apk | tee release/SHA256SUMS.txt
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zalma-Android-APK-${{ github.run_number }}
          path: |
            release/Zalma.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/Zalma.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/Zalma.apk release/SHA256SUMS.txt \
              --title "Zalma ${RELEASE_TAG}" \
              --notes-file docs/ANDROID_INSTALL.md \
              --prerelease --target "$GITHUB_SHA"
          fi
