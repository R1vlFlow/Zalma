name: Sync official schedules and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    env:
      SCHEDULE_ENGINE_VERSION: '4.8.0-rc.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - name: Install Node dependencies
        run: npm install
      - name: Verify schedule engine release metadata
        run: python scripts/verify_engine_version.py
      - name: Parser regression fixtures
        run: |
          python scripts/test_4k_matrix_real_pdf.py
          python scripts/test_5k_matrix_real_pdf.py
          python scripts/test_6k_matrix_real_pdf.py
          python tests/test_sync_parser.py
      - name: Sync official source snapshot
        run: python scripts/build_official_schedule.py
      - name: Full production QA
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: '1'
      - name: Validate generated official index
        run: |
          python scripts/validate_js.py
          python scripts/validate_generated_index.py
          python scripts/validate_schedule_data.py
      - name: Commit refreshed official data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-schedules.json data/official-sync-status.json
          git diff --cached --quiet || git commit -m 'chore: refresh official schedules'
          git push || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
